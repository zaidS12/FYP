# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agentflow
    runtime: node
    plan: free              # free has no disk; the data is kept in Supabase (REMOTE_STORE_*), so restarts do not reset it
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /tmp/agentflow-data      # with a paid plan use /var/data and uncomment the disk
      - key: ALLOW_FAKE_GATEWAY
        value: "1"                      # demo only, see README "Deploy"
      - key: REMOTE_STORE_URL           # Supabase table URL, see README "Deploy"; set in the Render dashboard, never in git
        sync: false
      - key: REMOTE_STORE_KEY           # Supabase service_role key (secret)
        sync: false
    # disk:
    #   name: agentflow-data
    #   mountPath: /var/data
    #   sizeGB: 1
